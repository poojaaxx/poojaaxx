name: Generate GitHub Stats

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: GitHub activity, repositories and community
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          filename: github-stats.svg
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          config_padding: 0, 8 + 11%
          commit_message: "Update GitHub stats [skip ci]"

      - name: Most used languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          filename: top-languages.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_indepth: yes
          commit_message: "Update top languages [skip ci]"
