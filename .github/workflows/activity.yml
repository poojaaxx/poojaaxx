name: Update Recent Activity

on:
  schedule:
    - cron: "45 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README activity section
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh api "users/${OWNER}/events/public?per_page=60" > events.json
          python3 - <<'PY'
          import json, os, re

          owner = os.environ["OWNER"]
          events = json.load(open("events.json"))
          lines = []

          def link(repo):
              return f"[{repo}](https://github.com/{repo})"

          for e in events:
              t, repo, p = e["type"], e["repo"]["name"], e["payload"]
              day = e["created_at"][:10]
              text = None
              if t == "PushEvent":
                  branch = p.get("ref", "").replace("refs/heads/", "")
                  text = f"🔨 Pushed commits to `{branch}` in {link(repo)}"
              elif t == "PullRequestEvent":
                  pr = p["pull_request"]
                  text = f"🔀 {p['action'].capitalize()} PR [#{pr['number']}]({pr['html_url']}) in {link(repo)}"
              elif t == "IssuesEvent":
                  i = p["issue"]
                  text = f"🐛 {p['action'].capitalize()} issue [#{i['number']}]({i['html_url']}) in {link(repo)}"
              elif t == "IssueCommentEvent":
                  i = p["issue"]
                  text = f"💬 Commented on [#{i['number']}]({i['html_url']}) in {link(repo)}"
              elif t == "CreateEvent" and p.get("ref_type") == "repository":
                  text = f"📦 Created repository {link(repo)}"
              elif t == "ReleaseEvent":
                  text = f"🚀 Released {p['release']['tag_name']} in {link(repo)}"
              elif t == "WatchEvent":
                  text = f"⭐ Starred {link(repo)}"
              elif t == "ForkEvent":
                  text = f"🍴 Forked {link(repo)}"
              if text:
                  item = f"- `{day}` {text}"
                  if item not in lines:
                      lines.append(item)
              if len(lines) >= 8:
                  break

          body = "\n".join(lines) if lines else "_No recent public activity._"
          s = open("README.md", encoding="utf-8").read()
          new = re.sub(
              r"(<!--START_SECTION:activity-->).*?(<!--END_SECTION:activity-->)",
              lambda m: f"{m.group(1)}\n{body}\n{m.group(2)}",
              s, flags=re.S)
          open("README.md", "w", encoding="utf-8").write(new)
          PY
          rm -f events.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update recent GitHub activity"
            git pull --rebase
            git push
          fi
